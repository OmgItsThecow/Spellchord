name: Build Spellchord Releases

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows x64 (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop & fetch packages
        run: |
          flutter config --enable-windows-desktop
          flutter pub get

      - name: Run Flutter tests
        run: flutter test

      - name: Build Windows release executable
        run: flutter build windows --release

      - name: Upload Spellchord-Windows-x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Spellchord-Windows-x64
          path: build/windows/x64/runner/Release/

  build-android:
    name: Build Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fetch packages
        run: flutter pub get

      - name: Build Android release APK
        run: flutter build apk --release

      - name: Upload Spellchord-Android-APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Spellchord-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  build-linux:
    name: Build Linux x64 bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GTK3 & Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Linux desktop & fetch packages
        run: |
          flutter config --enable-linux-desktop
          flutter pub get

      - name: Build Linux release bundle
        run: flutter build linux --release

      - name: Upload Spellchord-Linux-x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Spellchord-Linux-x64
          path: build/linux/x64/release/bundle/
